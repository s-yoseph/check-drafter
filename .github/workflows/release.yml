# =========================================================
# 🧩 Release Drafter and Publisher Workflow
# Supports both stable and pre-release publishing
# =========================================================

name: Release Drafter and Publisher

on:
  # Allow manual trigger
  workflow_dispatch:

  # Automatically trigger when PRs target 'develop'
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches:
      - develop

  # Optional: Also run when something is pushed to develop
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------
  # 🧾 Debug trigger (helps verify if workflow runs)
  # ---------------------------------------------------------
  debug_trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Debug event info
        run: |
          echo "✅ Workflow triggered by: ${{ github.event_name }}"
          echo "🔀 Event action: ${{ github.event.action }}"
          echo "🌿 Ref: ${{ github.ref }}"
          echo "🧱 Base ref: ${{ github.base_ref }}"
          echo "🎯 Target branch: develop"

  # ---------------------------------------------------------
  # 🧱 1️⃣ Update Release Draft
  # ---------------------------------------------------------
  update_release_draft:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Release Drafter
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          commitish: develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------
  # 🚀 2️⃣ Publish Draft Release
  # ---------------------------------------------------------
  publish_draft:
    runs-on: ubuntu-latest
    needs: update_release_draft
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'Publish') ||
        contains(github.event.pull_request.labels.*.name, 'Pre-release')
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish draft release
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({ owner, repo });
            const draft = releases.data.find(r => r.draft);

            if (!draft) {
              core.setFailed("❌ No draft release found to publish.");
              return;
            }

            const labels = context.payload.pull_request.labels.map(l => l.name);
            const isPre = labels.includes('Pre-release');

            console.log(`📦 Found draft: ${draft.tag_name}`);
            console.log(`🔖 Publishing as ${isPre ? 'pre-release' : 'stable'}...`);

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: draft.id,
              draft: false,
              prerelease: isPre,
            });

            console.log(`✅ Published ${isPre ? 'pre-release' : 'stable'} release: ${draft.tag_name}`);
