name: Release Drafter and Publisher

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------
  # 🧱 1️⃣ Update Draft (always runs for PRs on develop)
  # ---------------------------------------------------------
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          commitish: develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------
  # 🚀 2️⃣ Publish Draft Release (Stable or Pre-release)
  # ---------------------------------------------------------
  publish_draft:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'Publish') ||
        contains(github.event.pull_request.labels.*.name, 'Pre-release')
      )
    needs: update_release_draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish draft release
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({ owner, repo });
            const draft = releases.data.find(r => r.draft);

            if (!draft) {
              core.setFailed("❌ No draft release found to publish.");
              return;
            }

            // Detect PR labels
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const isPreRelease = labels.includes('Pre-release');
            const releaseType = isPreRelease ? 'pre-release' : 'stable';

            console.log(`📦 Found draft: ${draft.tag_name}`);
            console.log(`🔖 Publishing as ${releaseType}...`);

            // Publish the draft release with the correct flag
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: draft.id,
              draft: false,
              prerelease: isPreRelease,
            });

            console.log(`✅ Published ${releaseType} release: ${draft.tag_name}`);
