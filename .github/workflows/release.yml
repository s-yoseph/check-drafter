name: Release Drafter and Publisher

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          commitish: develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_draft:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'Publish Pre-release') ||
        contains(github.event.pull_request.labels.*.name, 'Publish Stable')
      )
    needs: update_release_draft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish draft release (detect pre-release or stable)
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { owner, repo } = context.repo;

            const releases = await github.rest.repos.listReleases({ owner, repo });
            const draft = releases.data.find(r => r.draft);

            if (!draft) {
              core.setFailed("❌ No draft release found to publish.");
              return;
            }

            // Detect label type
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const isPreRelease = labels.includes('Publish Pre-release');

            console.log(`📦 Found draft: ${draft.tag_name}`);
            console.log(`🔖 Publishing as ${isPreRelease ? 'pre-release' : 'stable'}...`);

            try {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: draft.id,
                draft: false,
                prerelease: isPreRelease
              });
              console.log(`✅ ${isPreRelease ? 'Pre-release' : 'Stable release'} "${draft.tag_name}" published successfully!`);
            } catch (error) {
              core.setFailed(`❌ Failed to publish release: ${error.message}`);
              throw error;
            }
